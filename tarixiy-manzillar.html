/* =================================
   SIRDARYO 360 — YUQORI PANEL
================================= */

.top{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;

  background:#fff;
  border:1px solid #e1e8ed;
  border-radius:18px;

  padding:12px 18px;

  box-shadow:0 3px 12px rgba(30,60,80,.05);

  position:sticky;
  top:10px;
  z-index:100;
}


/* LOGO */

.site-logo{
  display:flex;
  align-items:center;
  gap:12px;

  text-decoration:none;

  min-width:0;
}

.logo-flag{
  width:66px;
  height:42px;

  object-fit:cover;

  border-radius:6px;

  flex-shrink:0;
}

.logo-text{
  line-height:1.1;
}

.logo-title{
  font-size:21px;
  font-weight:900;
  letter-spacing:.3px;
  color:#1678c4;
}

.logo-title span{
  color:#20a873;
}

.logo-subtitle{
  margin-top:4px;

  font-size:13px;
  font-weight:600;

  color:#8a969d;
}


/* O‘NG TOMON */

.top-actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;

  gap:8px;

  margin-left:auto;

  flex-shrink:0;
}


/* UMUMIY TUGMA */

.top-btn{
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;

  padding:0 14px;

  border:1px solid #dfe7ec;
  border-radius:12px;

  background:#fff;

  color:#172b3a;

  font-size:14px;
  font-weight:700;

  text-decoration:none;

  cursor:pointer;

  transition:.2s;
}

.top-btn:hover{
  background:#f4f8fa;
}


/* TIL */

.lang{
  position:relative;
}

.lang-main{
  min-width:92px;
}

.lang-flag{
  width:22px;
  height:14px;

  object-fit:cover;

  border-radius:2px;

  flex-shrink:0;
}

.lang-arrow{
  font-size:11px;
  margin-left:1px;
}


/* TIL MENYUSI */

.lang-menu{
  display:none;

  position:absolute;

  right:0;
  top:48px;

  width:150px;

  padding:7px;

  background:#fff;

  border:1px solid #dfe7ec;
  border-radius:12px;

  box-shadow:0 10px 30px rgba(20,50,70,.14);

  z-index:200;
}

.lang-menu.open{
  display:block;
}

.lang-menu button{
  width:100%;

  display:flex;
  align-items:center;

  gap:9px;

  padding:9px 10px;

  border:0;
  border-radius:8px;

  background:transparent;

  color:#1b2d39;

  font-size:14px;
  font-weight:600;

  text-align:left;

  cursor:pointer;
}

.lang-menu button:hover{
  background:#eef7f3;
}


/* KUN / TUN */

.theme-btn{
  width:48px;
  padding:0;

  font-size:19px;
}


/* ASOSIY SAHIFA */

.home-btn{
  white-space:nowrap;
}


/* TUNGI REJIM */

body.dark .top{
  background:#172228;
  border-color:#2c3b43;
}

body.dark .top-btn{
  background:#172228;
  border-color:#34454e;
  color:#edf5f7;
}

body.dark .top-btn:hover{
  background:#203038;
}

body.dark .lang-menu{
  background:#172228;
  border-color:#34454e;
}

body.dark .lang-menu button{
  color:#edf5f7;
}

body.dark .lang-menu button:hover{
  background:#203a34;
}


/* TELEFON */

@media(max-width:650px){

  .top{
    padding:10px 12px;
    border-radius:15px;
  }

  .logo-flag{
    width:48px;
    height:32px;
  }

  .logo-title{
    font-size:16px;
  }

  .logo-subtitle{
    font-size:10px;
  }

  .top-actions{
    gap:5px;
  }

  .top-btn{
    height:38px;
    padding:0 9px;
  }

  .home-btn{
    font-size:12px;
  }

  .lang-main{
    min-width:auto;
  }

/* =========================
   ASOSIY SAHIFA / KARTALAR CSS
========================= */

:root{
  --bg:#f5f8fa;
  --card:#fff;
  --ink:#1c2b36;
  --muted:#6d7b85;
  --green:#1ea672;
  --blue:#2878c8;
  --line:#dfe7ec;
  --soft:#eaf6f1;
}

*{
  box-sizing:border-box;
}

html{
  min-height:100%;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
}

body.dark{
  --bg:#10181d;
  --card:#172228;
  --ink:#edf5f7;
  --muted:#a9b7be;
  --line:#2c3b43;
  --soft:#18372d;
}

.wrap{
  width:100%;
  max-width:1280px;
  margin:0 auto;
  padding:18px 22px 45px;
}

/* YUQORI PANEL */
body.dark .top{
  background:var(--card);
  border-color:var(--line);
}

body.dark .top-btn{
  background:var(--card);
  border-color:#34454e;
  color:var(--ink);
}

body.dark .top-btn:hover{
  background:#203038;
}

body.dark .lang-menu{
  background:var(--card);
  border-color:#34454e;
}

body.dark .lang-menu button{
  color:var(--ink);
}

body.dark .lang-menu button:hover{
  background:#203a34;
}

/* TIL BAYROQLARI */
.lang-menu .lang-flag{
  display:block;
  width:22px;
  height:14px;
  object-fit:cover;
  border-radius:2px;
  flex:0 0 auto;
}

/* HERO */
.hero{
  padding:38px 5px 22px;
}

.eyebrow{
  color:var(--green);
  font-weight:800;
  font-size:13px;
  letter-spacing:.5px;
}

.hero h1{
  margin:8px 0;
  font-size:34px;
  line-height:1.2;
  color:var(--ink);
}

.hero p{
  max-width:900px;
  margin:0;
  color:var(--muted);
  line-height:1.6;
}

/* QIDIRUV */
.tools{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  background:var(--card);
  border:1px solid var(--line);
  padding:14px;
  border-radius:14px;
  margin-bottom:20px;
}

.tools input,
.tools select{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink);
  border-radius:10px;
  padding:11px 12px;
  min-width:200px;
  outline:none;
  font:inherit;
}

.tools input{
  flex:1 1 360px;
}

.tools select{
  flex:0 1 210px;
}

.tools input:focus,
.tools select:focus{
  border-color:#8dcdb5;
  box-shadow:0 0 0 3px rgba(30,166,114,.10);
}

.count{
  margin-left:auto;
  display:flex;
  align-items:center;
  color:var(--muted);
  font-weight:700;
}

/* KARTALAR */
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}

.card{
  min-width:0;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}

.card:hover{
  transform:translateY(-2px);
  border-color:#9acfb9;
  box-shadow:0 8px 22px rgba(20,50,70,.08);
}

.visual{
  height:145px;
  background:linear-gradient(135deg,#dcebe5,#eef3f5);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

body.dark .visual{
  background:linear-gradient(135deg,#18372d,#203038);
}

.visual svg{
  width:70px;
  height:70px;
  color:var(--green);
  display:block;
}

.body{
  padding:15px;
}

.body h3{
  margin:0 0 8px;
  font-size:18px;
  line-height:1.3;
  color:var(--ink);
}

.meta{
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
}

.actions2{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.actions2 a,
.actions2 button{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  text-decoration:none;
  border:0;
  border-radius:10px;
  padding:10px 8px;
  font:inherit;
  font-weight:800;
  font-size:12px;
  cursor:pointer;
}

.primary{
  background:var(--green);
  color:#fff;
}

.secondary{
  background:var(--soft);
  color:var(--green);
}

.actions2 button.primary:hover{
  filter:brightness(.96);
}

.actions2 a.secondary:hover{
  filter:brightness(.97);
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.52);
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.show{
  display:flex;
}

.dialog{
  width:min(680px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  color:var(--ink);
  border-radius:18px;
  border:1px solid var(--line);
  padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.20);
}

.dialog-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.dialog h2{
  margin:0;
  color:var(--ink);
}

.close{
  border:0;
  background:none;
  color:var(--muted);
  font-size:24px;
  line-height:1;
  cursor:pointer;
}

.detail{
  margin-top:16px;
  color:var(--muted);
  line-height:1.7;
}

.coord{
  font-family:monospace;
  font-size:12px;
  background:var(--soft);
  color:var(--ink);
  padding:10px;
  border-radius:10px;
  margin-top:12px;
}

.footer{
  text-align:center;
  color:var(--muted);
  padding:35px 0 5px;
  font-size:12px;
}

/* TELEFON */
@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:650px){
  .wrap{
    padding:10px 12px 35px;
  }

  .hero{
    padding:28px 2px 18px;
  }

  .hero h1{
    font-size:28px;
  }

  .tools{
    padding:12px;
  }

  .tools input,
  .tools select{
    width:100%;
    min-width:0;
    flex:1 1 100%;
  }

  .count{
    width:100%;
    margin-left:0;
  }
}

@media(max-width:520px){
  .grid{
    grid-template-columns:1fr;
  }

  .actions2{
    flex-direction:row;
  }

  .dialog{
    padding:17px;
  }
}

   YORDAMCHI
========================= */

let lang = localStorage.getItem("language") || "uz";

const $ = s => document.querySelector(s);


/* =========================
   KARTALARNI CHIQARISH
========================= */

function render(){

  const q = $("#search").value.toLowerCase().trim();

  let arr = places.filter(p =>
    p.name.toLowerCase().includes(q)
  );

  arr.sort((a,b)=>
    $("#sort").value === "az"
      ? a.name.localeCompare(b.name)
      : b.name.localeCompare(a.name)
  );


  $("#grid").innerHTML = arr.map(p => `

    <article class="card">

      <div class="visual">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/>
          <path d="M9.5 9a2.5 2.5 0 1 0 5 0 2.5 2.5 0 0 0-5 0Z"/>
        </svg>

      </div>

      <div class="body">

        <h3>${p.name}</h3>

        <div class="meta">
          📍 ${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}
        </div>

        <div class="actions2">

          <button
            class="primary"
            data-detail="${p.id}"
          >
            ${tr[lang].detail}
          </button>

          <a
            class="secondary"
            target="_blank"
            rel="noopener"
            href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}"
          >
            ${tr[lang].direction}
          </a>

        </div>

      </div>

    </article>

  `).join("");


  $("#count").textContent =
    arr.length + " " + tr[lang].count;


  document.querySelectorAll("[data-detail]")
    .forEach(b => {

      b.addEventListener("click", () =>
        open(+b.dataset.detail)
      );

    });

}


/* =========================
   TARJIMANI QO‘LLASH
========================= */

function applyLang(){

  document.documentElement.lang = lang;


  document.querySelectorAll("[data-t]")
    .forEach(e => {

      const key = e.dataset.t;

      if(tr[lang][key]){
        e.textContent = tr[lang][key];
      }

    });


  $("#search").placeholder = tr[lang].search;


  $("#langLabel").textContent =
    LANG_DATA[lang].name;


  $("#langFlag").src =
    LANG_DATA[lang].flag;


  $("#langFlag").alt =
    LANG_DATA[lang].name;


  /* select optionlar */

  $("#sort").querySelector('[value="az"]').textContent =
    tr[lang].sortAz;

  $("#sort").querySelector('[value="za"]').textContent =
    tr[lang].sortZa;


  updateTheme();


  render();

}


/* =========================
   MODAL
========================= */

function open(id){

  const p = places.find(x => x.id === id);

  if(!p) return;


  $("#mTitle").textContent = p.name;


  $("#mText").textContent =
    tr[lang].info;


  $("#mCoord").textContent =
    tr[lang].coord +
    ": " +
    p.lat.toFixed(8) +
    ", " +
    p.lon.toFixed(8);


  $("#mMap").href =
    `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;


  $("#mOsm").href =
    `https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lon}#map=16/${p.lat}/${p.lon}`;


  $("#modal").classList.add("show");

}


/* =========================
   TUNGI / KUNDUZGI REJIM
========================= */

function updateTheme(){

  const isDark =
    document.body.classList.contains("dark");


  /*
    KUNDUZGI REJIM  → 🌙
    TUNGI REJIM     → ☀️
  */

  $("#theme").textContent =
    isDark ? "☀️" : "🌙";


  $("#theme").title =
    isDark
      ? tr[lang].day
      : tr[lang].night;

}


/* =========================
   QIDIRUV VA SARALASH
========================= */

$("#search")
  .addEventListener("input", render);


$("#sort")
  .addEventListener("change", render);


/* =========================
   MODALNI YOPISH
========================= */

$("#close")
  .addEventListener("click", () =>
    $("#modal").classList.remove("show")
  );


$("#modal")
  .addEventListener("click", e => {

    if(e.target.id === "modal"){
      $("#modal").classList.remove("show");
    }

  });


/* =========================
   TUNGI/KUNDUZGI REJIM
========================= */

$("#theme")
  .addEventListener("click", () => {

    document.body.classList.toggle("dark");


    localStorage.setItem(
      "foodDark",
      document.body.classList.contains("dark")
        ? "1"
        : "0"
    );


    updateTheme();

  });


/* =========================
   SAQLANGAN REJIMNI YUKLASH
========================= */

if(
  localStorage.getItem("foodDark") === "1"
){

  document.body.classList.add("dark");

}


/* =========================
   TIL MENYUSI
========================= */

$("#langBtn")
  .addEventListener("click", e => {

    e.stopPropagation();

    $("#langMenu")
      .classList.toggle("open");

  });


document.querySelectorAll("[data-lang]")
  .forEach(button => {

    button.addEventListener("click", () => {

      lang = button.dataset.lang;


      localStorage.setItem(
        "language",
        lang
      );


      $("#langMenu")
        .classList.remove("open");


      applyLang();

    });

  });


/* Menyudan tashqariga bosilganda yopiladi */

document.addEventListener("click", e => {

  if(
    !e.target.closest(".lang")
  ){

    $("#langMenu")
      .classList.remove("open");

  }

});


/* =========================
   ISHGA TUSHIRISH
========================= */

applyLang();

</script>

</body>
</html>
