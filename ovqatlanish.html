<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ovqatlanish — Sirdaryo 360°</title>

<style>
:root{
  --blue:#1d6fb8;
  --green:#1ea672;
  --bg:#f4f7fa;
  --card:#fff;
  --ink:#1c2b36;
  --dim:#6b7c88;
  --line:#e4e9ee;
  --soft:#eef6fb;
  --shadow:0 8px 24px rgba(25,55,75,.08)
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,Arial,sans-serif;
  transition:.2s
}

.page{
  max-width:1180px;
  margin:auto;
  padding:22px
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px
}

.brand{
  font-weight:800
}

.brand span{
  color:var(--blue)
}

.tools{
  display:flex;
  gap:8px;
  position:relative
}

.tool,
.back{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink);
  padding:10px 13px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none
}

.lang-wrap{
  position:relative
}

.lang-menu{
  display:none;
  position:absolute;
  right:0;
  top:calc(100% + 7px);
  width:165px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:var(--shadow);
  padding:6px;
  z-index:20
}

.lang-menu.open{
  display:block
}

.lang-option{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:var(--ink);
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600
}

.lang-option:hover,
.lang-option.active{
  background:var(--soft);
  color:var(--blue)
}

.lang-flag{
  width:20px;
  height:14px;
  object-fit:cover;
  border-radius:2px;
  vertical-align:-2px;
  display:inline-block;
  flex-shrink:0
}

.hero{
  margin-bottom:24px
}

.kicker{
  font-size:11px;
  font-weight:800;
  letter-spacing:.12em;
  color:var(--blue);
  text-transform:uppercase
}

h1{
  font-size:36px;
  margin:7px 0
}

.intro{
  color:var(--dim);
  line-height:1.6
}

.filters{
  display:grid;
  grid-template-columns:1fr 180px 180px;
  gap:10px;
  margin:22px 0
}

.filters input,
.filters select{
  padding:13px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--card);
  color:var(--ink)
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:transform .18s,box-shadow .18s
}

.card:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(25,55,75,.12)
}

.photo{
  height:190px;
  background:#eaf0f3;
  overflow:hidden;
  position:relative
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.photo .fallback{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px
}

.body{
  padding:16px
}

.tag{
  display:inline-block;
  background:var(--soft);
  color:var(--blue);
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
  font-weight:800
}

.name{
  font-size:18px;
  font-weight:800;
  margin:9px 0 5px
}

.meta{
  font-size:12px;
  color:var(--dim);
  line-height:1.65
}

.rating{
  margin:9px 0;
  font-weight:800
}

.rating small{
  font-weight:500;
  color:var(--dim)
}

.chips{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin:10px 0
}

.chip{
  font-size:10px;
  padding:5px 7px;
  border-radius:7px;
  background:#f0f4f6
}

.actions{
  display:flex;
  gap:7px;
  margin-top:12px
}

.btn{
  flex:1;
  text-align:center;
  padding:10px 7px;
  border-radius:9px;
  text-decoration:none;
  font-size:12px;
  font-weight:800;
  border:0;
  cursor:pointer
}

.primary{
  background:var(--green);
  color:white
}

.secondary{
  background:var(--soft);
  color:var(--blue)
}

.empty{
  text-align:center;
  padding:40px;
  color:var(--dim);
  grid-column:1/-1
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.48);
  z-index:50;
  align-items:center;
  justify-content:center;
  padding:18px
}

.modal.open{
  display:flex
}

.modal-box{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 18px 50px rgba(0,0,0,.22)
}

.modal-head{
  position:relative
}

.modal-head img{
  width:100%;
  height:240px;
  object-fit:cover;
  display:block
}

.modal-close{
  position:absolute;
  right:12px;
  top:12px;
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.58);
  color:#fff;
  font-size:22px;
  cursor:pointer
}

.modal-body{
  padding:20px
}

.modal-title{
  font-size:25px;
  font-weight:800;
  margin:0 0 6px
}

.modal-meta{
  color:var(--dim);
  line-height:1.7
}

.modal-actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:16px
}

.modal-actions .btn{
  min-width:150px
}

.dark .modal-box{
  box-shadow:0 18px 50px rgba(0,0,0,.5)
}

.dark{
  --bg:#101820;
  --card:#18232c;
  --ink:#eef4f7;
  --dim:#aab9c2;
  --line:#2b3a44;
  --soft:#203642;
  --shadow:0 8px 24px rgba(0,0,0,.22)
}

.dark .chip{
  background:#24313a
}

@media(max-width:850px){

  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .filters{
    grid-template-columns:1fr 1fr
  }

  .filters input{
    grid-column:1/-1
  }
}

@media(max-width:560px){

  .page{
    padding:14px
  }

  .grid{
    grid-template-columns:1fr
  }

  .filters{
    grid-template-columns:1fr
  }

  .top{
    align-items:flex-start
  }

  .back{
    display:none
  }

  h1{
    font-size:29px
  }

  .lang-menu{
    right:-5px
  }
}
</style>
</head>

  <div class="hero">

      TURIST UCHUN QULAYLIK

    <h1 id="title">
      Ovqatlanish joylari
    </h1>

    <p class="intro" id="intro">
      Sirdaryo viloyatidagi restoran, kafe, bar, oshxona va tez ovqatlanish maskanlarini toping.
    </p>

  </div>


  <div class="filters">

    <input
      id="search"
      placeholder="🔎 Joy nomini qidiring..."
      aria-label="Qidiruv"
    >

    <select id="district" aria-label="Hudud">
      <option value="all">Barcha hududlar</option>
      <option value="Guliston">Guliston</option>
      <option value="Yangiyer">Yangiyer</option>
      <option value="Shirin">Shirin</option>
      <option value="Sirdaryo">Sirdaryo</option>
    </select>

    <select id="type" aria-label="Tur">
      <option value="all">Barcha turlar</option>
      <option value="Restoran">Restoran</option>
      <option value="Qahvaxona">Qahvaxona</option>
      <option value="Bar">Bar</option>
      <option value="Tez ovqatlanish">Tez ovqatlanish</option>
      <option value="Milliy taomlar">Milliy taomlar</option>
    </select>

  </div>


  <div class="grid" id="grid"></div>

</div>


<div
  class="modal"
  id="detailModal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modalTitle"
>

  <div class="modal-box">

    <div class="modal-head">

      <img
        id="modalImg"
        src=""
        alt=""

      <button
        class="modal-close"
        id="modalClose"
        aria-label="Yopish"

        ×
      </button>

    </div>

    <div class="modal-body">

      <div class="tag" id="modalType"></div>

      <h2 class="modal-title" id="modalTitle"></h2>

      <div class="modal-meta" id="modalMeta"></div>

      <div class="chips" id="modalChips"></div>

      <div class="modal-actions">

        <a
          class="btn primary"
          id="modalMap"
          target="_blank"
          rel="noopener"
        >
          🗺️ Yo‘nalish
        </a>

        <a
          class="btn secondary"
          id="modalPhone"
        >
          ☎️ Telefon qilish
        </a>

      </div>

    </div>

  </div>

</div>

let lang='uz';


/* =========================
   DOM ELEMENTLAR
========================= */

const search=document.getElementById('search');
const district=document.getElementById('district');
const type=document.getElementById('type');
const grid=document.getElementById('grid');

const detailModal=document.getElementById('detailModal');
const modalImg=document.getElementById('modalImg');
const modalClose=document.getElementById('modalClose');
const modalTitle=document.getElementById('modalTitle');
const modalType=document.getElementById('modalType');
const modalRating=document.getElementById('modalRating');
const modalMeta=document.getElementById('modalMeta');
const modalChips=document.getElementById('modalChips');
const modalMap=document.getElementById('modalMap');
const modalPhone=document.getElementById('modalPhone');

const title=document.getElementById('title');
const intro=document.getElementById('intro');

const langButton=document.getElementById('lang');
const langMenu=document.getElementById('langMenu');
const langFlag=document.getElementById('langFlag');
const langLabel=document.getElementById('langLabel');

const darkButton=document.getElementById('dark');
const darkIcon=document.getElementById('darkIcon');


/* =========================
   BAYROQLAR
========================= */

const FLAG_URLS={

  uz:'https://flagcdn.com/w40/uz.png',

  en:'https://flagcdn.com/w40/gb.png',

  ru:'https://flagcdn.com/w40/ru.png',

  tr:'https://flagcdn.com/w40/tr.png',

  zh:'https://flagcdn.com/w40/cn.png'

};


/* =========================
   TIL NOMLARI
========================= */

const LANG_NAMES={

  uz:'O‘zbek',

  en:'English',

  ru:'Русский',

  tr:'Türkçe',

  zh:'中文'

};


/* =========================
   TUR TARJIMALARI
========================= */

function typeText(value){

  return typeNames[lang]?.[value] || value;

}


/* =========================
   TIL TUGMASINI YANGILASH
========================= */

function updateLanguageButton(){

  langFlag.src=FLAG_URLS[lang];

  langFlag.alt=lang.toUpperCase();

  langLabel.textContent=LANG_NAMES[lang];

}


/* =========================
   TIL MENYUSI
========================= */

function setupLanguageMenu(){

  langMenu.querySelectorAll('.lang-option').forEach(button=>{

    button.addEventListener('click',event=>{

      event.stopPropagation();

      lang=button.dataset.lang;

      langMenu.classList.remove('open');

      langButton.setAttribute(
        'aria-expanded',
        'false'
      );

      applyLang();

    });

  });

}


/* =========================
   FILTRLARNI YANGILASH
========================= */

function updateFilters(){

  const currentDistrict=district.value;

  const currentType=type.value;

  const t=texts[lang];


  district.innerHTML=`

    <option value="all">
      ${t.allDistrict}
    </option>

    <option value="Guliston">
      ${lang==='uz'?'Guliston':lang==='en'?'Gulistan':lang==='ru'?'Гулистан':lang==='tr'?'Guliston':'Гулистон'}
    </option>

    <option value="Yangiyer">
      ${lang==='uz'?'Yangiyer':lang==='en'?'Yangiyer':lang==='ru'?'Янгиер':lang==='tr'?'Yangiyer':'扬吉耶尔'}
    </option>

    <option value="Shirin">
      ${lang==='uz'?'Shirin':lang==='en'?'Shirin':lang==='ru'?'Ширин':lang==='tr'?'Shirin':'希林'}
    </option>

    <option value="Sirdaryo">
      ${lang==='uz'?'Sirdaryo':lang==='en'?'Syrdarya':lang==='ru'?'Сырдарья':lang==='tr'?'Sırdarya':'锡尔河'}
    </option>

  `;


  type.innerHTML=`

    <option value="all">
      ${t.allType}
    </option>

    <option value="Restoran">
      ${typeText('Restoran')}
    </option>

    <option value="Qahvaxona">
      ${typeText('Qahvaxona')}
    </option>

    <option value="Bar">
      ${typeText('Bar')}
    </option>

    <option value="Tez ovqatlanish">
      ${typeText('Tez ovqatlanish')}
    </option>

    <option value="Milliy taomlar">
      ${typeText('Milliy taomlar')}
    </option>

  `;


  if(
    [...district.options].some(o=>o.value===currentDistrict)
  ){
    district.value=currentDistrict;
  }

  if(
    [...type.options].some(o=>o.value===currentType)
  ){
    type.value=currentType;
  }

}


/* =========================
   KARTALARNI CHIQARISH
========================= */

function render(){

  const q=
    search.value
      .toLowerCase()
      .trim();

  const d=district.value;

  const t=type.value;


  const filtered=data.filter(x=>{

    const searchable=
      (
        x[0]+' '+
        x[1]+' '+
        x[2]+' '+
        x[5]
      ).toLowerCase();


    const searchMatch=
      !q ||
      searchable.includes(q);


    const districtMatch=
      d==='all' ||
      x[1]===d;


    const typeMatch=
      t==='all' ||
      x[2]===t;


    return(
      searchMatch &&
      districtMatch &&
      typeMatch
    );

  });


  if(!filtered.length){

    grid.innerHTML=`
      <div class="empty">
        ${texts[lang].no}
      </div>
    `;

    return;

  }


  grid.innerHTML=filtered.map(x=>{

    const index=data.indexOf(x);

    return`

      <article class="card">

        <div class="photo">

          <img
            src="${x[7]}"
            alt="${x[0]}"
            loading="lazy"
            onerror="
              this.onerror=null;
              this.src=FOODIMG[${index%FOODIMG.length}]
            "
          >

        </div>


        <div class="body">

          <span class="tag">
            ${typeText(x[2])}
          </span>


          <div class="name">
            ${x[0]}
          </div>


          <div class="rating">

            ⭐ ${x[3]}

            <small>
              (${x[4]} ${texts[lang].reviews})
            </small>

          </div>


          <div class="meta">

            📍 ${x[1]}, ${x[5]}

            <br>

            💰 ${x[6]}

            ${
              x[9]
              ? '<br>☎️ '+x[9]
              : ''
            }

            ${
              x[10]
              ? '<br>🕐 '+x[10]
              : ''
            }

          </div>


          <div class="chips">

            ${x[11].map(c=>`

              <span class="chip">
                ${c}
              </span>

            `).join('')}

          </div>


          <div class="actions">

            <a
              class="btn primary"
              href="${x[8]}"
              target="_blank"
              rel="noopener"
            >
              🗺️ ${texts[lang].direction}
            </a>


            <button
              class="btn secondary detail-btn"
              data-index="${index}"
            >
              ℹ️ ${texts[lang].detail}
            </button>

          </div>

        </div>

      </article>

    `;

  }).join('');


  document
    .querySelectorAll('.detail-btn')
    .forEach(button=>{

      button.addEventListener('click',()=>{

        openDetail(
          Number(button.dataset.index)
        );

      });

    });

}


/* =========================
   BATAFSIL OYNASI
========================= */

function openDetail(index){

  const x=data[index];

  if(!x){
    return;
  }


  modalImg.src=x[7];

  modalImg.alt=x[0];


  modalTitle.textContent=x[0];


  modalType.textContent=
    typeText(x[2]);


  modalRating.textContent=
    '⭐ '+x[3]+
    ' ('+
    x[4]+' '+
    texts[lang].reviews+
    ')';


  modalMeta.innerHTML=`

    📍 ${x[1]}, ${x[5]}

    <br>

    💰 ${x[6]}

    ${
      x[10]
      ? '<br>🕐 '+x[10]
      : ''
    }

    ${
      x[9]
      ? '<br>☎️ '+x[9]
      : ''
    }

  `;


  modalChips.innerHTML=
    x[11]
      .map(c=>`

        <span class="chip">
          ${c}
        </span>

      `)
      .join('');


  modalMap.href=x[8];


  if(x[9]){

    modalPhone.href=
      'tel:'+
      x[9].replace(/[^\d+]/g,'');

    modalPhone.textContent=
      '☎️ '+texts[lang].call;

    modalPhone.style.display=
      'inline-block';

  }else{

    modalPhone.removeAttribute('href');

    modalPhone.style.display=
      'none';

  }


  detailModal.classList.add('open');

}


/* =========================
   MODALNI YOPISH
========================= */

function closeDetail(){

  detailModal.classList.remove('open');

}


/* =========================
   TARJIMA
========================= */

function applyLang(){

  const t=texts[lang];


  title.textContent=
    t.title;


  intro.textContent=
    t.intro;


  search.placeholder=
    t.search;


  updateLanguageButton();


  updateFilters();


  document
    .querySelectorAll('.lang-option')
    .forEach(button=>{

      button.classList.toggle(
        'active',
        button.dataset.lang===lang
      );

    });


  render();

}


/* =========================
   KUN / TUN REJIMI
========================= */

function updateDarkIcon(){

  const isDark=
    document.body.classList.contains('dark');


  darkIcon.textContent=
    isDark
      ? '☀️'
      : '🌙';


  darkButton.title=
    isDark
      ? 'Kunduzgi rejim'
      : 'Tungi rejim';


  darkButton.setAttribute(
    'aria-label',
    isDark
      ? 'Kunduzgi rejim'
      : 'Tungi rejim'
  );

}


/* =========================
   KUN / TUNNI ALMASHTIRISH
========================= */

function toggleDarkMode(){

  document.body.classList.toggle('dark');


  const isDark=
    document.body.classList.contains('dark');


  localStorage.setItem(
    'foodDark',
    isDark ? '1' : '0'
  );


  updateDarkIcon();

}


/* =========================
   EVENTLAR
========================= */

search.addEventListener(
  'input',
  render
);


district.addEventListener(
  'change',
  render
);


type.addEventListener(
  'change',
  render
);


darkButton.addEventListener(
  'click',
  toggleDarkMode
);


modalClose.addEventListener(
  'click',
  closeDetail
);


detailModal.addEventListener(
  'click',
  event=>{

    if(event.target===detailModal){

      closeDetail();

    }

  }
);


document.addEventListener(
  'keydown',
  event=>{

    if(event.key==='Escape'){

      closeDetail();

    }

  }
);


/* =========================
   TIL MENYUSI
========================= */

langButton.addEventListener(
  'click',
  event=>{

    event.stopPropagation();


    const isOpen=
      langMenu.classList.toggle('open');


    langButton.setAttribute(
      'aria-expanded',
      isOpen
        ? 'true'
        : 'false'
    );

  }
);


document.addEventListener(
  'click',
  event=>{

    if(
      !event.target.closest('.lang-wrap')
    ){

      langMenu.classList.remove('open');

      langButton.setAttribute(
        'aria-expanded',
        'false'
      );

    }

  }
);


/* =========================
   SAQLANGAN TUNGI REJIM
========================= */

if(
  localStorage.getItem('foodDark')==='1'
){

  document.body.classList.add('dark');

}


/* =========================
   BOSHLANG‘ICH HOLAT
========================= */

updateDarkIcon();

setupLanguageMenu();

applyLang();

</script>
