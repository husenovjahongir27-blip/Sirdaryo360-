<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sirdaryo 360 — Tarixiy manzillar</title>
<style>
:root{--bg:#f5f8fa;--card:#fff;--ink:#1c2b36;--muted:#6d7b85;--green:#1ea672;--blue:#2878c8;--line:#dfe7ec;--soft:#eaf6f1}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
body.dark{--bg:#10181d;--card:#172228;--ink:#edf5f7;--muted:#a9b7be;--line:#2c3b43;--soft:#18372d}
.wrap{max-width:1280px;margin:auto;padding:18px 22px 45px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 18px;position:sticky;top:10px;z-index:10}.brand{font-weight:800;font-size:20px;color:var(--blue)}.brand span{color:var(--green)}
.actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:700}.lang{position:relative}.menu{display:none;position:absolute;right:0;top:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:155px;box-shadow:0 8px 25px #0002}.menu.open{display:block}.menu button{width:100%;border:0;background:none;color:var(--ink);padding:9px;text-align:left;border-radius:8px;cursor:pointer}.menu button:hover{background:var(--soft)}
.hero{padding:38px 5px 22px}.eyebrow{color:var(--green);font-weight:800;font-size:13px}.hero h1{font-size:34px;margin:8px 0}.hero p{max-width:760px;color:var(--muted);line-height:1.6}.tools{display:flex;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);padding:14px;border-radius:14px;margin-bottom:20px}.tools input,.tools select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 12px;min-width:200px;outline:none}.count{margin-left:auto;display:flex;align-items:center;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#9acfb9}.visual{height:145px;background:linear-gradient(135deg,#dcebe5,#eef3f5);display:flex;align-items:center;justify-content:center;position:relative}.visual svg{width:70px;height:70px;color:var(--green)}.tag{position:absolute;left:12px;top:12px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.body{padding:15px}.body h3{margin:0 0 8px;font-size:18px}.meta{color:var(--muted);font-size:13px;line-height:1.55}.actions2{display:flex;gap:8px;margin-top:14px}.actions2 a,.actions2 button{flex:1;text-align:center;text-decoration:none;border:0;border-radius:10px;padding:10px 8px;font-weight:800;font-size:12px;cursor:pointer}.primary{background:var(--green);color:#fff}.secondary{background:var(--soft);color:var(--green)}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:30;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.dialog{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:18px;border:1px solid var(--line);padding:22px}.dialog-head{display:flex;justify-content:space-between;gap:10px}.dialog h2{margin:0}.close{border:0;background:none;color:var(--muted);font-size:24px;cursor:pointer}.detail{margin-top:16px;color:var(--muted);line-height:1.7}.coord{font-family:monospace;font-size:12px;background:var(--soft);padding:10px;border-radius:10px;margin-top:12px}.footer{text-align:center;color:var(--muted);padding:35px 0 5px;font-size:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.wrap{padding:10px 12px 35px}.top{position:static}.grid{grid-template-columns:1fr}.hero h1{font-size:28px}.count{width:100%;margin-left:0}.tools input,.tools select{width:100%;min-width:0}}
</style></head>
<body><div class="wrap">
<header class="top"><a class="brand" href="index.html" style="text-decoration:none">Sirdaryo<span>360</span></a><div class="actions"><a class="btn" href="index.html">🏠 Bosh sahifa</a><button class="btn" id="theme">🌙</button><div class="lang"><button class="btn" id="langBtn">🌐 O‘zbekcha ▾</button><div class="menu" id="langMenu"><button data-lang="uz">🇺🇿 O‘zbekcha</button><button data-lang="en">🇬🇧 English</button><button data-lang="ru">🇷🇺 Русский</button><button data-lang="tr">🇹🇷 Türkçe</button><button data-lang="zh">🇨🇳 中文</button></div></div></div></header>
<section class="hero"><div class="eyebrow" data-t="eyebrow">SIRDARYO 360 • TARIX</div><h1 data-t="title">Tarixiy manzillar</h1><p data-t="intro">KML loyihasidagi tarixiy manzillar bir sahifada jamlandi. Har bir obyektning nomi va KML faylida berilgan aniq koordinatalari saqlandi.</p></section>
<div class="tools"><input id="search" placeholder="🔎 Manzilni qidiring..." aria-label="Qidiruv"><select id="sort"><option value="az">Nom bo‘yicha A–Z</option><option value="za">Nom bo‘yicha Z–A</option></select><div class="count" id="count"></div></div>
<main class="grid" id="grid"></main><div class="footer">© 2026 Sirdaryo 360</div></div>
<div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><h2 id="mTitle"></h2><button class="close" id="close">×</button></div><div class="detail" id="mText"></div><div class="coord" id="mCoord"></div><div class="actions2"><a id="mMap" class="primary" target="_blank" rel="noopener">🗺️ Google Maps</a><a id="mOsm" class="secondary" target="_blank" rel="noopener">📍 Xarita</a></div></div></div>
<script>
const places=[["Katta qiztepa", 40.89749722222221, 68.11037777777779], ["Puchuktepa", 40.83083055555555, 68.6457277777778], ["Qo’rg’ontepa", 40.82521388888891, 68.68273888888886], ["Uchtepa", 40.81618333333332, 68.691225], ["Nurota shaharchasi qoldig’i", 40.78279166666669, 68.78693333333334], ["Chittitepa", 40.66204999999998, 68.86424166666666], ["Qal’atepa", 40.62869166666668, 68.92650555555556], ["Kindiktepa", 40.65840000000001, 68.867], ["Saritepa", 40.74640605555557, 68.78431725000002], ["Sigirtepa", 40.70403333333333, 68.92211111111112], ["Hashartepa", 40.43373888888889, 69.07888888888888], ["Eski Xovos shaharchasi", 40.19983055555554, 68.81106111111109], ["Toltepa", 40.19966666666667, 68.83511944444444], ["Nomsiztepa", 40.20098611111113, 68.8106], ["Ulkan-Soylik", 40.53296666666666, 68.75668611111108], ["Mirzarabot tepaligi", 40.5104611111111, 68.45178055555554], ["Qo’rg’ontepa 1", 40.20536388888886, 68.81560555555556], ["Yerjar", 40.38697777777777, 69.07781111111109]].map((x,i)=>({id:i+1,name:x[0],lat:x[1],lon:x[2]}));
const tr={uz:{eyebrow:'SIRDARYO 360 • TARIX',title:'Tarixiy manzillar',intro:'KML loyihasidagi tarixiy manzillar bir sahifada jamlandi. Har bir obyektning nomi va KML faylida berilgan aniq koordinatalari saqlandi.',search:'🔎 Manzilni qidiring...',count:'ta tarixiy manzil',detail:'Batafsil ma’lumot',coord:'KML koordinatasi'},en:{eyebrow:'SIRDARYO 360 • HISTORY',title:'Historical sites',intro:'Historical locations from the KML project are collected on one page. Names and exact coordinates from the KML file are preserved.',search:'🔎 Search site...',count:'historical sites',detail:'Details',coord:'KML coordinates'},ru:{eyebrow:'SIRDARYO 360 • ИСТОРИЯ',title:'Исторические места',intro:'Исторические места из KML-проекта собраны на одной странице. Названия и точные координаты сохранены из файла KML.',search:'🔎 Поиск...',count:'исторических мест',detail:'Подробнее',coord:'Координаты KML'},tr:{eyebrow:'SIRDARYO 360 • TARİH',title:'Tarihi yerler',intro:'KML projesindeki tarihi yerler tek sayfada toplandı. KML dosyasındaki adlar ve kesin koordinatlar korunmuştur.',search:'🔎 Yer ara...',count:'tarihi yer',detail:'Detaylar',coord:'KML koordinatları'},zh:{eyebrow:'SIRDARYO 360 • 历史',title:'历史遗址',intro:'KML 项目中的历史地点集中在此页面。保留了 KML 文件中的名称和准确坐标。',search:'🔎 搜索地点...',count:'处历史遗址',detail:'详细信息',coord:'KML 坐标'}};
let lang='uz';const $=s=>document.querySelector(s);function render(){let q=$('#search').value.toLowerCase();let arr=places.filter(p=>p.name.toLowerCase().includes(q));arr.sort((a,b)=>$('#sort').value==='az'?a.name.localeCompare(b.name):b.name.localeCompare(a.name));$('#grid').innerHTML=arr.map(p=>`<article class="card"><div class="visual"><span class="tag">${p.id}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><path d="M9.5 9a2.5 2.5 0 1 0 5 0 2.5 2.5 0 0 0-5 0Z"/></svg></div><div class="body"><h3>${p.name}</h3><div class="meta">📍 ${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</div><div class="actions2"><button class="primary" data-detail="${p.id}">${tr[lang].detail}</button><a class="secondary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}">🧭 Yo‘nalish</a></div></div></article>`).join('');$('#count').textContent=arr.length+' '+tr[lang].count;document.querySelectorAll('[data-detail]').forEach(b=>b.addEventListener('click',()=>open(+b.dataset.detail)));}
function applyLang(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tr[lang][e.dataset.t]);$('#search').placeholder=tr[lang].search;$('#langBtn').textContent=({uz:'🇺🇿 O‘zbekcha',en:'🇬🇧 English',ru:'🇷🇺 Русский',tr:'🇹🇷 Türkçe',zh:'🇨🇳 中文'})[lang]+' ▾';render();}
function open(id){let p=places.find(x=>x.id===id);$('#mTitle').textContent=p.name;$('#mText').textContent=tr[lang].detail+': KML faylida ushbu obyekt uchun nom va geografik koordinata berilgan. Qo‘shimcha tarixiy tavsif KML manbasida mavjud emas.';$('#mCoord').textContent=tr[lang].coord+': '+p.lat.toFixed(8)+', '+p.lon.toFixed(8);$('#mMap').href=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;$('#mOsm').href=`https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lon}#map=16/${p.lat}/${p.lon}`;$('#modal').classList.add('show')}
$('#search').addEventListener('input',render);$('#sort').addEventListener('change',render);$('#close').addEventListener('click',()=>$('#modal').classList.remove('show'));$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')});$('#theme').addEventListener('click',()=>document.body.classList.toggle('dark'));$('#langBtn').addEventListener('click',()=>$('#langMenu').classList.toggle('open'));document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;$('#langMenu').classList.remove('open');applyLang()}));applyLang();
</script></body></html>
