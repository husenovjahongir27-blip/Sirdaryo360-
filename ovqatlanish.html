const texts={uz:{title:'Ovqatlanish joylari',intro:'Sirdaryo viloyatidagi restoran, kafe, bar, oshxona va tez ovqatlanish maskanlarini toping.',search:'🔎 Joy nomini qidiring...',allDistrict:'Barcha hududlar',allType:'Barcha turlar',no:'Mos keladigan ovqatlanish joyi topilmadi.',direction:'Yo‘nalish',detail:'Batafsil'},en:{title:'Places to eat',intro:'Find restaurants, cafes, bars, local food and fast-food places across Syrdarya region.',search:'🔎 Search places...',allDistrict:'All areas',allType:'All types',no:'No matching places found.',direction:'Directions',detail:'Details'},ru:{title:'Места для питания',intro:'Рестораны, кафе, бары, национальная кухня и фастфуд Сырдарьинской области.',search:'🔎 Поиск места...',allDistrict:'Все районы',allType:'Все типы',no:'Подходящих мест не найдено.',direction:'Маршрут',detail:'Подробнее'},tr:{title:'Yeme içme yerleri',intro:'Sırdarya bölgesindeki restoran, kafe, bar ve fast food mekânlarını bulun.',search:'🔎 Mekân ara...',allDistrict:'Tüm bölgeler',allType:'Tüm türler',no:'Uygun yer bulunamadı.',direction:'Yol tarifi',detail:'Detaylar'},zh:{title:'餐饮场所',intro:'查找锡尔河州的餐厅、咖啡馆、酒吧和快餐店。',search:'🔎 搜索地点...',allDistrict:'所有地区',allType:'所有类型',no:'没有找到匹配的地点。',direction:'路线',detail:'详情'}};

async function loadFoodFromSupabase(){
 try{
  if(!window.supabase||!window.SUPABASE_URL||!window.SUPABASE_KEY)return;
  const client=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_KEY);
  const {data:rows,error}=await client.from('places').select('*').eq('category','food').eq('is_active',true).order('created_at',{ascending:false});
  if(error){console.warn(error.message);return;}
  const remote=(rows||[]).map(p=>[p.name_uz||'Nomsiz',p.district||'Sirdaryo',p.food_type||'Restoran',p.rating?String(p.rating):'—',p.review_count?String(p.review_count):'0',p.address||p.district||'',p.price||'—',p.image_url||generic,p.maps_url||`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((p.name_uz||'Ovqatlanish joyi')+' '+(p.district||'Sirdaryo'))}`,p.phone||'',p.hours||'',Array.isArray(p.amenities)?p.amenities:[]]);
  const names=new Set(remote.map(x=>x[0].trim().toLowerCase()));
  data=[...remote,...staticData.filter(x=>!names.has(String(x[0]).trim().toLowerCase()))];
  render();
 }catch(e){console.warn(e);}
}
function render(){const q=search.value.toLowerCase(),d=district.value,t=type.value;const a=data.filter(x=>(x[0].toLowerCase().includes(q)||x[5].toLowerCase().includes(q))&&(d==='all'||x[1]===d)&&(t==='all'||x[2]===t));grid.innerHTML=a.length?a.map((x,i)=>`<article class="card"><div class="photo"><img src="${x[7]}" alt="${x[0]}" onerror="this.onerror=null;this.src=FOODIMG[${i%8}]"></div><div class="body"><span class="tag">${x[2]}</span><div class="name">${x[0]}</div><div class="rating">⭐ ${x[3]} <small>(${x[4]} ta baho)</small></div><div class="meta">📍 ${x[1]}, ${x[5]}<br>💰 ${x[6]}${x[9]?'<br>☎️ '+x[9]:''}${x[10]?'<br>🕐 '+x[10]:''}</div><div class="chips">${x[11].map(c=>`<span class="chip">${c}</span>`).join('')}</div><div class="actions"><a class="btn primary" href="${x[8]}" target="_blank">🗺️ ${texts[lang].direction}</a><button class="btn secondary detail-btn" data-index="${data.indexOf(x)}">ℹ️ ${texts[lang].detail}</button></div></div></article>`).join(''):`<div class="empty">${texts[lang].no}</div>`;document.querySelectorAll('.detail-btn').forEach(b=>b.addEventListener('click',()=>openDetail(Number(b.dataset.index))))}
function openDetail(i){const x=data[i];modalImg.src=x[7];modalImg.alt=x[0];modalTitle.textContent=x[0];modalType.textContent=x[2];modalRating.textContent='⭐ '+x[3]+' ('+x[4]+' ta baho)';modalMeta.innerHTML='📍 '+x[1]+', '+x[5]+'<br>💰 '+x[6]+(x[10]?'<br>🕐 '+x[10]:'')+(x[9]?'<br>☎️ '+x[9]:'');modalChips.innerHTML=x[11].map(c=>'<span class="chip">'+c+'</span>').join('');modalMap.href=x[8];if(x[9]){modalPhone.href='tel:'+x[9];modalPhone.style.display='inline-block'}else{modalPhone.removeAttribute('href');modalPhone.style.display='none'}detailModal.classList.add('open')}
function closeDetail(){detailModal.classList.remove('open')}
modalClose.addEventListener('click',closeDetail);detailModal.addEventListener('click',e=>{if(e.target===detailModal)closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});

function applyLang(){const t=texts[lang];title.textContent=t.title;intro.textContent=t.intro;search.placeholder=t.search;langLabel.textContent={uz:'O‘zbek',en:'English',ru:'Русский',tr:'Türkçe',zh:'中文'}[lang];const opts=[...district.options];opts[0].textContent=t.allDistrict;const types=[...type.options];types[0].textContent=t.allType;document.querySelectorAll('.lang-option').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));render()}
search.addEventListener('input',render);district.addEventListener('change',render);type.addEventListener('change',render);document.getElementById('dark').addEventListener('click',()=>{document.body.classList.toggle('dark');localStorage.setItem('foodDark',document.body.classList.contains('dark')?'1':'0')});if(localStorage.getItem('foodDark')==='1')document.body.classList.add('dark');document.getElementById('lang').addEventListener('click',()=>{const m=document.getElementById('langMenu');m.classList.toggle('open');document.getElementById('lang').setAttribute('aria-expanded',m.classList.contains('open'))});document.querySelectorAll('.lang-option').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;document.getElementById('langMenu').classList.remove('open');document.getElementById('lang').setAttribute('aria-expanded','false');applyLang()}));document.addEventListener('click',e=>{if(!e.target.closest('.lang-wrap')){document.getElementById('langMenu').classList.remove('open');document.getElementById('lang').setAttribute('aria-expanded','false')}});applyLang();
